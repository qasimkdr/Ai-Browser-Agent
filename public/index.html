<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Browser Agent V6</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#07101f;color:#eaf2ff}.wrap{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#0b1729;border:1px solid #1d3152;border-radius:18px;padding:18px;margin:16px 0}input,textarea,button{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:1px solid #294162;background:#081323;color:#eef5ff}button{background:linear-gradient(135deg,#3277ff,#7257ff);font-weight:800;cursor:pointer}.row{display:flex;gap:8px}.muted{color:#8ea0bb}.pill{padding:5px 9px;border-radius:999px;background:#152a47}.job,.event{padding:10px;border-bottom:1px solid #1b2d4b}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:12px;padding:7px;width:auto;min-width:78px}.timeline{max-height:520px;overflow:auto}@media(max-width:800px){.grid{grid-template-columns:1fr}.row{display:block}}</style></head><body><div class="wrap"><div class="top"><div><h1>AI Browser Agent V6</h1><div class="muted">Visible Chromium + identity memory + smarter forms + recovery + export</div></div><span id="health" class="pill">Checking…</span></div><div class="grid"><main><div class="card"><h2>Start Authorized Test Job</h2><input id="url" placeholder="https://staging.example.com"><textarea id="goal" placeholder="Describe the authorized workflow">Complete the authorized browser workflow</textarea><div class="row"><input id="count" type="number" min="1" value="1"><input id="gmail" type="file" accept=".txt,.csv"></div><label><input id="show" type="checkbox" checked style="width:auto"> Keep Chromium visible while AI works</label><button onclick="startJob()">START SMART JOB</button><small class="muted">ALLOWED_DOMAINS is required. CAPTCHA, anti-bot, identity verification and 2FA remain manual.</small></div><div class="card"><h2>Jobs</h2><div id="jobs"></div></div><div class="card"><h2>Saved Profiles</h2><div id="profiles"></div></div></main><aside><div class="card"><h2>Live Agent</h2><div id="live" class="muted">Select a job.</div><div id="timeline" class="timeline"></div></div></aside></div></div><script>let selected=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){const t=localStorage.agentToken||'';o.headers={...(o.headers||{}),...(t?{Authorization:'Bearer '+t}:{})};let r=await fetch(p,o);if(r.status===401){const x=prompt('Dashboard token');if(x){localStorage.agentToken=x;return api(p,o)}}const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}async function startJob(){try{const f=new FormData();f.append('url',url.value);f.append('goal',goal.value);f.append('count',count.value);f.append('showBrowser',show.checked?'true':'false');if(gmail.files[0])f.append('gmailList',gmail.files[0]);const j=await api('/api/start',{method:'POST',body:f});selected=j.jobId;await refresh()}catch(e){alert(e.message)}}async function control(id,a){await api('/api/jobs/'+id+'/'+a,{method:'POST'});selected=id;refresh()}async function selectJob(id){selected=id;refresh()}async function downloadExport(id,format){try{const t=localStorage.agentToken||'';if(!t){const x=prompt('Dashboard token required for credential export');if(!x)return;localStorage.agentToken=x}const r=await fetch('/api/jobs/'+encodeURIComponent(id)+'/export?format='+format,{headers:{Authorization:'Bearer '+localStorage.agentToken}});if(!r.ok){const j=await r.json().catch(()=>({}));throw Error(j.error||'Export failed')}const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=id+'-test-identities.'+(format==='csv'?'csv':'json');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){alert(e.message)}}async function refresh(){try{const h=await api('/api/health');health.textContent='V'+h.version+' • Ready';const js=await api('/api/jobs');jobs.innerHTML=js.length?js.map(j=>`<div class="job"><b>${esc(j.jobId)}</b> <span class="pill">${esc(j.status)}</span><div class="muted">${esc(j.statusText)} • ${j.currentAccount}/${j.count} • success ${j.successCount} • failed ${j.failedCount}</div><div class="actions"><button onclick="selectJob('${j.jobId}')">Inspect</button><button onclick="control('${j.jobId}','pause')">Pause</button><button onclick="control('${j.jobId}','resume')">Resume</button><button onclick="control('${j.jobId}','stop')">Stop</button><button onclick="downloadExport('${j.jobId}','json')">Export JSON</button><button onclick="downloadExport('${j.jobId}','csv')">Export CSV</button></div></div>`).join(''):'<div class="muted">No jobs yet.</div>';const ps=await api('/api/profiles');profiles.innerHTML=ps.length?ps.map(p=>`<div class="job">${esc(p.jobId)} / ${esc(p.account)}<button onclick="openProfile(this.dataset.dir)" data-dir="${esc(p.profileDir)}">Open Visible Browser</button></div>`).join(''):'<div class="muted">No saved profiles yet.</div>';if(selected){const j=await api('/api/jobs/'+selected),ev=await api('/api/jobs/'+selected+'/events');live.innerHTML=`<b>${esc(j.statusText)}</b><div class="muted">${esc(j.url)}</div>`;timeline.innerHTML=ev.map(e=>`<div class="event"><b>${esc(e.kind)}</b> ${esc(e.message)}<div class="muted">${esc(e.createdAt)}${e.accountNumber?' • account '+e.accountNumber:''}</div></div>`).join('')}}catch(e){health.textContent='Error';console.error(e)}}async function openProfile(dir){try{await api('/api/profiles/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profileDir:dir})})}catch(e){alert(e.message)}}refresh();setInterval(refresh,1500);</script></body></html>
